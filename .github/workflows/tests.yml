name: PHP and PostgreSQL
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: entity_generator_demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d entity_generator_demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
      - run: psql -h 127.0.0.1 -p 55432 -U demo -d entity_generator_demo -v ON_ERROR_STOP=1 -f examples/demo.sql
        env:
          PGPASSWORD: demo
      - run: composer test:postgres
      - run: php bin/entity-generator --env=.env.example --dry-run
